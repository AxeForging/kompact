name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: bun install --frozen-lockfile

      # vendor/ is gitignored, but the Codex interop test drives jev-compact's
      # own parser, scorer and client against our server. Without these it
      # skips silently, which is worse than failing.
      - name: fetch upstreams for the interop test
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/tamaratran/fast-jev-compaction.git vendor/fast-jev-compaction
          git clone --depth 1 https://github.com/fatelei/jev-compact.git vendor/jev-compact

      - run: bun x tsc -p tsconfig.all.json
      - run: bun x tsc -p tsconfig.hooks.json
      - run: bun x tsc
      - run: bun x vitest run

      # The interop test skips when vendor/ is missing; fail loudly if the
      # clone above stopped working rather than quietly losing the coverage.
      - name: the interop test must have run
        run: bun x vitest run test/codex-interop.test.ts --reporter=verbose 2>&1 | grep -q "codex plugin interop"

      # Same treatment for the transcript invariant: it used to need
      # ~/.claude/projects and skipped on a runner, so the one property that
      # breaks a session when it regresses had no pre-merge enforcement at all.
      - name: the transcript invariant must have run
        run: |
          # vitest wraps the " > " between suite and test name in ANSI codes, so
          # the separator has to be stripped before the name can be matched.
          bun x vitest run test/real-transcript.test.ts --reporter=verbose 2>&1 \
            | sed -r 's/\x1b\[[0-9;]*m//g' \
            | grep -q "committed session fixture > compacts offline and leaves no orphaned"

      # `claude plugin validate` is the only check that reads the manifest the way
      # the engine does — it is what caught `$.env?.get` being unreadable — so the
      # CLI is installed rather than the step skipped. It needs no credentials.
      - name: install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - run: bun run validate

      # `bin` pointed at a path `tsc` never built, so `npx laya-compact-serve`
      # would have failed for every installer. Pack it and run it.
      - name: the packed tarball must work
        run: |
          npm pack
          npm --prefix /tmp/packtest init -y
          npm --prefix /tmp/packtest install "$PWD"/laya-compact-*.tgz
          /tmp/packtest/node_modules/.bin/laya-compact-serve --help | grep -q "System One wire protocol"

      # The published AUC and retention, recomputed from the committed corpus.
      - run: bun run eval:ci

      # The two published pages are generated; regenerate and fail on a diff, so
      # a stale demonstration or evaluation cannot reach the site.
      - name: the published pages must be up to date
        run: |
          bun run docs
          git diff --exit-code -- docs/
