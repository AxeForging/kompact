name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: bun install --frozen-lockfile

      # vendor/ is gitignored, but the Codex interop test drives jev-compact's
      # own parser, scorer and client against our server. Without these it
      # skips silently, which is worse than failing.
      - name: fetch upstreams for the interop test
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/tamaratran/fast-jev-compaction.git vendor/fast-jev-compaction
          git clone --depth 1 https://github.com/fatelei/jev-compact.git vendor/jev-compact

      - run: bun x tsc -p tsconfig.all.json
      - run: bun x tsc -p tsconfig.hooks.json
      - run: bun x tsc
      - run: bun x vitest run

      # README and the page state a test count, and a test asserts the two agree
      # with each other — which a count that is stale in both survives. This is
      # the half that ties the stated number to the number of tests there are.
      - name: the stated test count must be the real one
        run: |
          COUNT=$(bun x vitest run --reporter=json --outputFile=/tmp/v.json >/dev/null 2>&1; \
                  bun -e 'const r=require("/tmp/v.json");console.log(r.numTotalTests)')
          grep -q "# $COUNT tests" README.md || { echo "README says $(grep -o '# [0-9]* tests' README.md), vitest ran $COUNT"; exit 1; }

      # The interop test skips when vendor/ is missing; fail loudly if the
      # clone above stopped working rather than quietly losing the coverage.
      - name: the interop test must have run
        run: bun x vitest run test/codex-interop.test.ts --reporter=verbose 2>&1 | grep -q "codex plugin interop"

      # Same treatment for the transcript invariant: it used to need
      # ~/.claude/projects and skipped on a runner, so the one property that
      # breaks a session when it regresses had no pre-merge enforcement at all.
      - name: the transcript invariant must have run
        run: |
          # vitest wraps the " > " between suite and test name in ANSI codes, so
          # the separator has to be stripped before the name can be matched.
          bun x vitest run test/real-transcript.test.ts --reporter=verbose 2>&1 \
            | sed -r 's/\x1b\[[0-9;]*m//g' \
            | grep -q "committed session fixture > introduces no orphaned tool call or result"

      # `claude plugin validate` is the only check that reads the manifest the way
      # the engine does — it is what caught `$.env?.get` being unreadable — so the
      # CLI is installed rather than the step skipped. It needs no credentials.
      - name: install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - run: bun run validate

      # `bin` pointed at a path `tsc` never built, so `npx kompact-serve`
      # would have failed for every installer. Pack it and run it.
      - name: the packed tarball must work
        run: |
          npm pack
          npm --prefix /tmp/packtest init -y
          npm --prefix /tmp/packtest install "$PWD"/kompact-*.tgz
          /tmp/packtest/node_modules/.bin/kompact-serve --help | grep -q "System One wire protocol"

      # The published AUC and retention, recomputed from the committed corpus.
      - run: bun run eval:ci

      # The Laya comparison used to vanish on a clone: its cached answers were
      # gitignored, so the paired block never ran and 0.721 survived as text.
      #
      # This asserted the literal "logistic won 10/10 splits". The closest split
      # is +0.018, so one split turning would have failed the build as a build
      # error rather than reporting itself as a measurement — and it would have
      # done that whether the cause was a regression or a better Laya. What has
      # to hold is that the paired block RAN on the fixture and still wins
      # clearly; the exact count is a result, and results belong in the report.
      - name: the fixture must reproduce the Laya comparison, not just ours
        run: |
          out=$(bun eval/repeat.ts --fixture)
          echo "$out"
          line=$(echo "$out" | grep -oE 'logistic won [0-9]+/[0-9]+ splits') \
            || { echo "::error::the paired Laya block did not run on the fixture"; exit 1; }
          won=${line#logistic won }; total=${won#*/}; total=${total% splits}; won=${won%%/*}
          echo "paired result: $won of $total splits"
          [ "$total" -ge 10 ] \
            || { echo "::error::only $total paired splits; the fixture corpus shrank"; exit 1; }
          [ "$((won * 10))" -ge "$((total * 8))" ] \
            || { echo "::error::logistic won only $won of $total splits (need 8 in 10)"; exit 1; }

      # Twelve published figures went stale at once because the evidence file
      # mixed fixture measurements with ones read from the maintainer's own
      # transcripts: regenerating moved bound numbers for reasons unrelated to
      # any code change. RESULTS.md is now the fixture-only half, so it is
      # reproducible on a runner with no ~/.claude/projects — gate it.
      - name: the reproducible evidence must be up to date
        run: |
          bun run eval:results
          git diff --exit-code -- eval/RESULTS.md

      # The two published pages are generated; regenerate and fail on a diff, so
      # a stale demonstration or evaluation cannot reach the site.
      - name: the published pages must be up to date
        run: |
          bun run docs
          git diff --exit-code -- docs/

      # Four defects reached the published page that no source review could
      # catch, because each was a rendered fact: a hint saying a table drags
      # where it cannot, an image whose narrow-screen rule was overridden at
      # equal specificity 139 lines later, columns clipping their own text, and
      # section rules 64px wider than every other rule. This measures the page.
      # The runner has no chromium-browser; setup-chrome reports where it put one.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: the rendered page must hold up at 1400px and 390px
        run: bun run docs:check
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
